[project]
name = "opportunity-intelligence"
version = "0.1.0"
description = "Extensible training and serving platform for small specialist models that process opportunity postings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "tokenizers>=0.23.2",
    "streamlit>=1.64.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
training = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "peft>=0.21.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "transformers>=4.57",
    "trl>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project", "collectors", "training"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
