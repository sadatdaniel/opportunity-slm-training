# Teacher provider pool (v2 brief section 17A).
# Limits below are OPERATING BUDGETS (configured safe budgets with margin),
# not the providers' true maximums. Update here when provider quotas change.
# API keys come from environment variables named in api_key_env; never store
# key values in this file.

providers:
  - name: gemini_1
    kind: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-3.5-flash-lite
    role: primary
    limits: {rpm: 15, tpm: 250000, rpd: 500}
    safety_margin: 0.70

  - name: gemini_2
    kind: gemini
    api_key_env: GEMINI_API_KEY2
    model: gemini-3.5-flash-lite
    role: primary
    limits: {rpm: 15, tpm: 250000, rpd: 500}
    safety_margin: 0.70

  - name: gemini_3
    kind: gemini
    api_key_env: GEMINI_API_KEY3
    model: gemini-3.5-flash-lite
    role: primary
    limits: {rpm: 15, tpm: 250000, rpd: 500}
    safety_margin: 0.70

  - name: gemini_4
    kind: gemini
    api_key_env: GEMINI_API_KEY4
    model: gemini-3.5-flash-lite
    role: primary
    limits: {rpm: 15, tpm: 250000, rpd: 500}
    safety_margin: 0.70

  # Primary overflow: benchmarked at 63.2% human / 100% json-valid (vs gemini
  # 58% on the same set) — picked up annotation while gemini slots are
  # daily-capped. Provenance records the gateway route honestly; the gateway
  # log holds the underlying provider per call.
  - name: omniroute_primary
    kind: openai
    base_url: http://127.0.0.1:20128/v1
    api_key_env: OMNI_ROUTER_API_KEY
    model: auto/best-reasoning
    role: primary
    limits: {rpm: 60, tpm: 1000000, rpd: 5000}
    safety_margin: 1.0
    json_mode: false

  # Self-hosted gateway (docker: opportunity_slm_omniroute, localhost:20128).
  # Aggregates free provider pools. auto/* routes abstract the underlying
  # provider — acceptable for second opinions/verification (not primary
  # annotation labels, whose provenance must be exact).
  - name: omniroute_reasoning
    kind: openai
    base_url: http://127.0.0.1:20128/v1
    api_key_env: OMNI_ROUTER_API_KEY
    model: auto/best-reasoning
    role: second_opinion
    # gateway aggregates many pools; per-pool limits handled by 429 backoff
    limits: {rpm: 60, tpm: 1000000, rpd: 5000}
    safety_margin: 1.0
    json_mode: false

  - name: omniroute_verifier
    kind: openai
    base_url: http://127.0.0.1:20128/v1
    api_key_env: OMNI_ROUTER_API_KEY
    model: auto/pro-reasoning
    role: verifier
    limits: {rpm: 60, tpm: 1000000, rpd: 5000}
    safety_margin: 1.0
    json_mode: false

  - name: openrouter
    kind: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # shootout winner (reports/openrouter_model_shootout.json): accuracy
    # identical to the 550B model at half the latency; lightning-3.5 was
    # disqualified (11.8% JSON validity — silently degraded on the free tier)
    model: nvidia/nemotron-3-super-120b-a12b:free
    role: second_opinion
    # account documents 1000 requests/day for free models; 850 = safety margin
    limits: {rpm: 20, tpm: 100000, rpd: 850}
    safety_margin: 1.0

  - name: deepseek
    kind: openai
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-flash
    role: verifier
    # DeepSeek documents CONCURRENCY limits, not RPM (2500 simultaneous for
    # deepseek-flash, 500 for v4-pro) — budgets below are effectively disabled
    # and the real limiter is max_concurrency.
    limits: {rpm: 100000, tpm: 100000000, rpd: 1000000}
    safety_margin: 0.99
    max_concurrency: 64

  - name: zai
    kind: openai
    # Coding Plan subscription key: uses the coding endpoint (verified against
    # the account; the standard /api/paas/v4 rejects it with "insufficient balance")
    base_url: https://api.z.ai/api/coding/paas/v4
    api_key_env: ZAI_API_KEY
    model: glm-5.3-flash
    role: adjudicator
    json_mode: false  # GLM returns clean JSON in content; reasoning goes to reasoning_content
    limits: {rpm: 30, tpm: 200000, rpd: 500}
    safety_margin: 0.85

  # Legacy single-teacher configuration (v1 .env): acts as an OpenAI-compatible
  # fallback when TEACHER_* variables are set.
  - name: legacy_teacher
    kind: openai
    base_url_env: TEACHER_BASE_URL
    api_key_env: TEACHER_API_KEY
    model_env: TEACHER_MODEL
    role: primary
    limits: {rpm: 20, tpm: 200000, rpd: 1000}
    safety_margin: 0.85

# Role order used when rotating providers for a normal record.
routing:
  primary_roles: [primary]
  second_opinion_roles: [second_opinion, verifier]
  adjudicator_roles: [adjudicator]
  verifier_roles: [verifier]
