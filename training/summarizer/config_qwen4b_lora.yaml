# A/B: Qwen3-4B LoRA on summarizer dataset v4
model: Qwen/Qwen3-4B
model_revision: main
dataset_version: v4
output_version: v0.3.0-qwen4b-lora
taxonomy: null
prompt_version: summarizer_v3

variant: lora            # 4B LoRA on A100 — batch 4, no checkpointing needed
max_seq_length: 1024
epochs: 3
learning_rate: 1.0e-4    # fallback
lora_learning_rate: 1.0e-4    # LoRA lr (trainer reads this when variant=lora)
batch_size: 4
gradient_accumulation: 8   # effective 32 with batch 4
warmup_ratio: 0.03
weight_decay: 0.0
optimizer: adamw_torch
scheduler: linear
precision: fp16


lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

smoke:
  epochs: 1
  max_examples: 4
  batch_size: 4
  output_version: smoke
